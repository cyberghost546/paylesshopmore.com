# Checks the deployed site, not the code.
#
# CI proves the code builds and the tests pass. It cannot prove the thing that
# actually breaks here, which is the seam: the site and Django are two
# components of one DigitalOcean App, and the routes in .do/app.yaml are the
# only thing joining them. Nothing fails when a route is wrong, and the
# symptom -- an API call answered with the React shell, so the app parses
# HTML as JSON -- looks like a frontend bug to everyone who sees it first.
#
# So: ask the live site the same questions a browser would.
#
# Runs after a deploy (dispatched by hand, since DigitalOcean deploys on its
# own schedule and does not report back here), and twice a day to catch the
# case where nothing was deployed and something broke anyway -- a certificate
# expiring, a database that was deleted, a component that stopped starting.

name: Smoke

on:
  workflow_dispatch:
    inputs:
      site:
        description: 'Origin to check (default: the production site)'
        required: false
        default: ''
  schedule:
    # 06:20 and 18:20 UTC. Not on the hour: GitHub's scheduler is busiest then
    # and delays runs by up to a quarter of an hour.
    - cron: '20 6,18 * * *'

# Never more than one of these at a time, and a manual run is worth more than
# a scheduled one -- it is somebody watching a deploy.
concurrency:
  group: smoke
  cancel-in-progress: false

# Read-only. Nothing here pushes, comments or publishes, so the token GitHub
# hands each job needs no write access - and a compromised action or
# dependency running in it gets none either.
permissions:
  contents: read

jobs:
  smoke:
    name: Live site
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The deployment origin. Set it once as a repository variable:
      # GitHub > Settings > Secrets and variables > Actions > Variables >
      # SMOKE_SITE = https://<your-app>.ondigitalocean.app (or your own domain
      # once it is attached). Until then a scheduled run only warns.
      - name: Resolve the origin to check
        id: target
        env:
          REQUESTED: ${{ inputs.site }}
          CONFIGURED: ${{ vars.SMOKE_SITE }}
        run: |
          if [ -n "$REQUESTED" ]; then
            echo "site=$REQUESTED" >> "$GITHUB_OUTPUT"
          elif [ -n "$CONFIGURED" ]; then
            echo "site=$CONFIGURED" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::SMOKE_SITE is not set, so there is no site to check. See the comment above this step."
          fi

      - name: Check
        if: steps.target.outputs.site != ''
        env:
          SITE: ${{ steps.target.outputs.site }}
        run: node scripts/smoke.mjs "$SITE"
